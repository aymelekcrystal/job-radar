name: Job Radar
on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # every 15 minutes (GitHub may delay or skip some runs)
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments for radar.py (e.g. --only wide --force)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python radar.py ${{ github.event.inputs.args }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add docs/jobs.json docs/desc.json data
          git diff --cached --quiet && exit 0
          git commit -q -m "radar: update"
          git pull -q --rebase --autostash || true
          git push -q
