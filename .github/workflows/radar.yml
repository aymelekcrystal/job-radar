name: Job Radar
on:
  schedule:
    - cron: "11 * * * *"     # watchdog only: restarts the scan loop if it has stopped
  workflow_dispatch:
    inputs:
      args:
        description: "One-off run with arguments for radar.py (leave empty to start the normal 15-minute loop)"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: cp scripts/loop.sh "$RUNNER_TEMP/loop.sh" && bash "$RUNNER_TEMP/loop.sh" "${{ github.event.inputs.args }}"
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
