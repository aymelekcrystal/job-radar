name: Job Radar
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15 dakikada bir (GitHub yogunlukta bazi turlari atlar)
  workflow_dispatch:
permissions:
  contents: write
concurrency: radar
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python radar.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOBSPIPE_API_KEY: ${{ secrets.JOBSPIPE_API_KEY }}
      - name: Sonuclari kaydet
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || (git commit -m "radar: update jobs" && git push)
