# Job Radar settings. This is the only file you normally need to edit.
# Patterns are regular expressions matched against the job TITLE (case-insensitive).

# A title must match at least one of these.
include:
  - '\bsdet\b'
  - '\bqa\b'
  - '\bquality (assurance|engineer|engineering)\b'
  - '\b(software|automation|qa|api|integration|functional|uat|manual) test(er|ing)?\b'
  - '\btest (automation|engineer|developer|architect|lead|analyst)\b'
  - '\b(engineer|developer) in test\b'
  - '\b(qa|test|quality) automation\b'
  - '\bautomation test\b'
  - '\b(ai|llm|ml|model|genai|agent) (evals?|evaluation|evaluator|quality|test|testing|qa|reliability)\b'
  - '\beval(s|uation)? (engineer|specialist|analyst)\b'
  - '\b(ai|llm|model) (red[- ]team\w*|safety tester)\b'
  - '\bqe\b'
  - '\bsde[- ]?t\b|\bsde in test\b'
  - '\bsoftware engineer\b.{0,25}\b(test|testing|quality|qa)\b'
  - '\b(test|quality)\b.{0,15}\bsoftware engineer\b'
  - '\btest(ing)? (specialist|consultant|manager|developer|coordinator)\b'
  - '\bautomation (engineer|developer)\b'
  - '\btester\b'
  - '\bquality analyst\b'
  - '\b(product|software|system|systems|platform|release) validation (engineer|lead|analyst|specialist|manager)\b'

# "Ece" tab: postings whose work is software testing although the title is not a usual QA title
# (validation, release, UAT, AI evaluation ...) and QA titles the main list is unsure about.
# On top of the usual location / degree / age rules the requirements must be about testing (filters.ece_fit):
# no posting that asks for years in another profession, no development jobs. Few postings, every one a fit.
ece_include:
  - '\b(validation|verification) (engineer|analyst|specialist|lead|tester)\b|\bv&v\b'
  - '\brelease (engineer|manager|coordinator|analyst)\b'
  - '\buat\b|\buser acceptance\b'
  - '\btest(ing|s)?\b|\bqa\b|\bquality assurance\b'
  - '\bquality (specialist|analyst|lead|coordinator|consultant|manager)\b'
  - '\b(ai|llm|genai|model|ml) (trainer|tutor|rater|reviewer|red[- ]team\w*|safety|evaluation|evaluator)\b|\bprompt engineer\b'
  - '\baccessibility (tester|specialist|analyst|engineer|auditor)\b'
  - '\b(performance|load) (test )?engineer\b'
  - '\b(certification|conformance|interoperability) (engineer|tester|analyst)\b'
  - '\b(defect|bug|triage) (manager|analyst|coordinator|engineer)\b'
ece_exclude:
  - '\b(design verification|asic|fpga|rtl|silicon|semiconductor|wafer|hardware|electrical|mechanical|rf|optical|battery|structural|civil)\b'
  - '\b(manufacturing|production|plant|process|supplier|vendor|materials|packaging|incoming|construction|aircraft|flight|vehicle|facilit\w+)\b'
  - '\b(clinical|pharma\w*|gmp|gcp|glp|laboratory|lab|food|nurse|patient|medical|care|pharmacy|microbiology|chemist\w*|device)\b'
  - '\b(call|claims|mortgage|loan|audit|auditor|financial|finance|accounting|tax|payroll|sales|marketing|coding|inspector|technician)\b'
  - '\b(compliance|regulatory|workforce|customer|data quality|site|field)\b'
  - '\b(proctor|test prep|standardized test|test center|testing center|drug test\w*|covid)\b'

# Always rejected.
exclude:
  - '\b(intern|internship|apprentice|co-?op)\b'
  - '\[test\]|\btest (job|posting|requisition)\b'
  - '\b(director|vp|vice president|head of)\b'
  - '\b(hardware|firmware|mechanical|electrical|rf|semiconductor|manufacturing|clinical|pharma\w*|food|construction|welding)\b'
  - '\b(nurse|nursing|physician|penetration|cybersecurity|security|spacecraft|avionics|flight|missile|aerospace|radiac)\b'
  - '\b(game|games|localization|localisation) (tester|qa)\b'
  - '\b(air|water) quality\b'
  - '\b(on[- ]?site only|100% on[- ]?site)\b'
  - '\b(drug|sterili[sz]ation|chemical|ballistic|armor|acoustic|durability|nuclear|fixed wire|pat test|m/w/d|m/f/d)\b'
  - '\b(sales|repair|estimating|reconstruction|casino|analytics & evaluation)\b'
  - '\b(plc|scada|robotics|industrial|controls?|building automation|marketing automation|penetration tester|pen tester)\b'
  - '\b(qa/qc|qc|devsecops|devops|network automation|rpa|cnc)\b'

# Rejected unless the title also matches "strong" below (keeps software roles, drops factory/compliance "QA").
exclude_soft:
  - '\b(compliance|audit|auditor|call|claims|customer|supplier|vendor|regulatory|gmp|gcp|glp|validation|device|materials)\b'
  - '\b(inspector|technician|coordinator|laboratory|lab|process|production|plant|site|field|facility|facilities|civil)\b'
  - '\b(mortgage|loan|pharmacy|patient|care|medical|microbiology|chemistry|chemist|packaging|incoming|supply|building)\b'
  - '\b(data quality|quality assurance (specialist|analyst|supervisor|manager|professional)|coding|optical|battery|structural)\b'
strong:
  - '\b(sdet|software|qa automation|qa (automation )?engineer|test automation|in test|api|ai|llm|ml|genai|web|mobile|platform|product validation|release validation)\b'

# Gets the "AI" badge.
ai_terms: ['\bai\b', '\bllm', '\bml\b', 'machine learning', 'genai', 'generative', '\beval', '\bagent']

# Recruiters / reposting boards that live on company career systems but are not the employer.
skip_companies: [jobgether, crossover, turing, braintrust, toptal, lensa, dice, actalent, teksystems]

# ---- how old ----
max_age_days: 30          # postings older than this are dropped
main_window_hours: 72     # the main tab shows this window; older ones go to the second tab

# ---- how often (the workflow itself fires every 15 minutes; all times are US Eastern) ----
rotation: {greenhouse: 8, lever: 8, ashby: 12}   # the full company list is covered once every N runs
# More career systems: the full list once every N runs (16 runs = 4 hours); companies seen hiring QA are read hourly.
rotation_wide: {smartrecruiters: 16, bamboohr: 16, workable: 16, rippling: 16, breezy: 16, recruitee: 16,
                teamtailor: 16, pinpoint: 8, gem: 8, recruiterbox: 8,
                oracle: 16, ukg: 8, jibe: 4, icims: 16, adp: 8,
                paycom: 48, successfactors: 16, personio: 32, dayforce: 8, paylocity: 4, jobvite: 4, jazzhr: 8}
workers: {workable: 4, smartrecruiters: 6, rippling: 6, gem: 4, workday: 6, oracle: 6, ukg: 4, jibe: 4, icims: 6, adp: 4,
          paycom: 6, successfactors: 6, personio: 6, dayforce: 4, paylocity: 2, jobvite: 4, jazzhr: 6}
search_terms: ["QA", "quality", "test", "SDET", "validation", "UAT"]  # for systems searched by keyword (Oracle, UKG, Jibe, iCIMS)   # gentler on systems that sit behind one address
hourly_every_runs: 4
parallel_systems: 8                              # career systems read at the same time
system_seconds: 420                              # one system may use at most this long per run; the rest waits for next run
per_run_cap: {default: 700, paylocity: 40, icims: 250, paycom: 150, workable: 320, oracle: 150, ukg: 80, personio: 150}
workday_universe_runs: 48                        # all Workday companies twice a day, a slice per run (dead addresses drop out)
workday_universe_terms: ["QA", "SDET", "test engineer"]
workday_watch_runs: 4                            # Workday companies seen hiring QA: a quarter per run, so each one hourly
workday_terms: ["QA", "SDET", "quality engineer", "test engineer", "test automation", "validation engineer", "UAT"]
amazon_terms: ["quality assurance engineer", "SDET", "test engineer"]

# ---- job platforms: only to top the day up to the target ----
# Platform postings go to the web page's "Platforms" tab, and to the "Platforms" tab of a Telegram group
# that has Topics switched on. They are never mixed into the company postings.
daily_target: 50
platform_every_minutes: 60       # LinkedIn/Indeed block callers that ask too often; keep this at 60 or more
platform_order: [indeed, remotive, himalayas, remoteok, jobicy, wwr, workingnomads]   # listed in the Platforms tab
discovery_sites: [linkedin]   # read only to learn which companies are hiring; never listed or sent
platform_terms: ["SDET", "QA automation engineer", "QA engineer", "test automation engineer", "AI QA engineer"]
platform_results: 40

# ---- Telegram ----
status_times: ["12:00", "19:00"]   # a short "I am running" message with the day's numbers (US Eastern)
quiet_hours: [23, 7]      # nothing is sent between 11pm and 7am ET; held postings arrive at 7am
max_messages_per_run: 220

# Telegram tabs made by hand in the group: {last 6 digits of the chat id: {tab name: tab id}}.
telegram_tabs: {"119995": {linkedin: 111, ece: 1001}}
# Retired tabs (renamed "baktiktan sonra sil"): nothing more is sent there.
telegram_closed_tabs: [354]
